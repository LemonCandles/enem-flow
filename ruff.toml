# Formatação e lint do Python; migrações aplicadas preservam sua forma original.
target-version = "py313"
line-length = 120
extend-exclude = ["backend/migrations/versions"]

[format]
quote-style = "preserve"

[lint]
# Só erros reais: importações e nomes não usados, e sintaxe suspeita.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]
