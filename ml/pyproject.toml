[project]
name = "enem-flow-ml"
version = "0.1.0"
description = "Treino da rede neural de tipos de layout do Enem Flow, fora dos lockfiles do backend e do frontend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "safetensors>=0.4",
    "huggingface_hub>=0.26",
    "pillow>=11",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
