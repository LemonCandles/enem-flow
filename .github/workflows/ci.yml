name: MVP checks
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: enem
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: enem_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enem -d enem_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: SQLite tests and migrations
        if: matrix.database == 'sqlite'
        run: |
          alembic upgrade head
          alembic check
          python scripts/audit_content.py
          pytest -q
      - name: PostgreSQL tests and migrations
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://enem:test-password@localhost:5432/enem_test
          TEST_DATABASE_URL: postgresql+psycopg://enem:test-password@localhost:5432/enem_test
        run: |
          alembic upgrade head
          alembic check
          pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock
      - run: |
          alembic upgrade head
          python -m backend.app.cli seed --publish-reviewed
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/enem-api.log 2>&1 &
      - run: npm ci && npm run check:content && npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          npm run start > /tmp/enem-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break || sleep 2; done
          npm run test:e2e -- --workers=1
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          retention-days: 7
          path: |
            frontend/test-results/**/*.json
            frontend/test-results/**/*.png
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: enem_ci_test
      POSTGRES_USER: enem_ci
      ALLOWED_ORIGINS: http://localhost:3300,http://127.0.0.1:3300
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure disposable environment
        run: python -c "import secrets; print('POSTGRES_PASSWORD=' + secrets.token_hex(24))" >> "$GITHUB_ENV"
      - name: Build and boot a clean Compose installation
        run: docker compose -p enem-ci -f compose.yaml -f compose.test.yaml up --build -d --wait --wait-timeout 180
      - name: Create persisted attempt
        run: python scripts/verify_deployment.py create --url http://localhost:3300 --state /tmp/enem-ci-state.json
      - name: Replace containers and verify persistent volumes
        run: |
          docker compose -p enem-ci -f compose.yaml -f compose.test.yaml down
          docker compose -p enem-ci -f compose.yaml -f compose.test.yaml up -d --wait --wait-timeout 180
          python scripts/verify_deployment.py check --url http://localhost:3300 --state /tmp/enem-ci-state.json
      - name: Container logs on failure
        if: failure()
        run: docker compose -p enem-ci -f compose.yaml -f compose.test.yaml logs --no-color --tail 100
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose -p enem-ci -f compose.yaml -f compose.test.yaml down -v
