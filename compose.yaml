services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enem_flow}
      POSTGRES_USER: ${POSTGRES_USER:-enem_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env e defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enem_flow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enem_flow}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORWARDED_ALLOW_IPS: ${ENEM_PROXY_IP:-172.30.246.254}
    networks: [database, proxy]
    volumes:
      - content_assets:/app/data/assets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.30.6-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      frontend:
      proxy:
        ipv4_address: ${ENEM_PROXY_IP:-172.30.246.254}
    depends_on:
      api:
        condition: service_healthy
        restart: true
      web:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  database:
  frontend:
  proxy:
    ipam:
      config:
        - subnet: ${ENEM_PROXY_SUBNET:-172.30.246.0/24}

volumes:
  postgres_data:
  content_assets:
